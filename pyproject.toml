[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triloom-utracer"
version = "0.1.0"
description = "Triloom UTRacer: a local-first forensic tracer for unknown UTR-like nucleotide sequences."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BioForge / Codex" }]
dependencies = [
  "Pillow>=10.0",
  "reportlab>=4.0"
]

[project.scripts]
triloom-utracer = "utr_forensics.cli:main"
utracer = "utr_forensics.cli:main"
utr-forensics = "utr_forensics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
utr_forensics = []
